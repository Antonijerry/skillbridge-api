services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-skillbridge}
      POSTGRES_USER: ${DB_USER:-skillbridge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skillbridge} -d ${DB_NAME:-skillbridge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skillbridge}
      DB_USER: ${DB_USER:-skillbridge}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    ports:
      - "8080:8080"

volumes:
  pgdata: