spring:
  application:
    name: skillbridge-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:skillbridge}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

skillbridge:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    rate-limit:
      auth:
        max-requests: ${RATE_LIMIT_AUTH_MAX:20}
        window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never